{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "softformarket.fullname" . }}-worker
  labels:
    {{- include "softformarket.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  # Recreate: worker — синглтон (поллеры GGSEL/заказов не координируются между
  # процессами), нельзя держать два одновременно во время обновления.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "softformarket.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Дренаж outbox при штатной остановке (OUTBOX_SHUTDOWN_GRACE_SECONDS).
      terminationGracePeriodSeconds: 180
      containers:
        - name: worker
          image: {{ include "softformarket.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          envFrom:
            - secretRef:
                name: {{ include "softformarket.secretName" . }}
          env:
            {{- include "softformarket.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "softformarket.configVolumeMounts" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        {{- include "softformarket.configVolume" . | nindent 8 }}
{{- end }}

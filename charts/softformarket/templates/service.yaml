apiVersion: v1
kind: Service
metadata:
  name: {{ include "softformarket.fullname" . }}
  labels:
    {{- include "softformarket.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http

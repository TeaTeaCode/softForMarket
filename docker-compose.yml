services:
  app:
    platform: linux/amd64
    image: softformarket-app
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
      - ./acme:/var/www/acme:ro
    command: ["/bin/sh", "-c", "while :; do sleep 43200; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  worker:
    platform: linux/amd64
    image: softformarket-app
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 3m
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

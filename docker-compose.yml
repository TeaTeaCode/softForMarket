services:
  app:
    platform: linux/amd64
    image: softformarket-app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-80}:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  worker:
    platform: linux/amd64
    image: softformarket-app
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  outbox-worker:
    platform: linux/amd64
    image: softformarket-app
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "-m", "app.outbox_worker"]
    restart: unless-stopped
    stop_grace_period: 3m
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
